<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Barangay Borrower Slip</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

    <body>

        <table width="100%">
            <tr>
                <td align="left">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnZEk5-R28_BcdqNQzh5R8KKYQ_787V7WHmP766q82aQ&s=10" alt="Barangay Logo" width="200" height="200">
                </td>

                <td align="center">
                    <h1>Barangay Pasong Camachile II</h1>
                    <h3>General Trias, Cavite 4107, Philippines</h3>
                    <h2>BORROWER SLIP</h2>
                </td>

                <td align="right">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZuU4BRcMTH_HZ2bykXINJzdM9kAINczMgkMHQpXkjkw&s=10" alt="Barangay SK Logo" width="200" height="200">
                </td>
            </tr>
        </table>

        <hr>

        <form method="POST" action="home.html">

            <div class="mb-3">
                <label for="f-name" class="form-label">Name:</label>
                <input type="text" id="f-name" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address:</label>
                <input type="text" id="address" name="address" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="chairs" class="form-label">No. of Chairs:</label>
                <input type="number" id="chairs" name="chairs" class="form-control" min="0" required>
            </div>

            <div class="mb-3">
                <label for="tables" class="form-label">No. of Tables:</label>
                <input type="number" id="tables" name="tables" class="form-control" min="0">
            </div>

            <div class="mb-3">
                <label for="tents" class="form-label">No. of Tents:</label>
                <input type="number" id="tents" name="tents" class="form-control" min="0">
            </div>

            <div class="mb-3">
                <label for="dateBorrowed" class="form-label">Date Borrowed:</label>
                <input type="datetime-local" id="dateBorrowed" name="dateBorrowed" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="dateReturned" class="form-label">Date Returned:</label>
                <input type="datetime-local" id="dateReturned" name="dateReturned" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="validID" class="form-label">Valid ID Upload With Signature:</label>
                <input type="file" id="validID" name="file" class="form-control" required>
            </div>

            <div class="form-check mb-3">
            <input type="checkbox" id="agree" name="agree" class="form-check-input" checked required>
            <label for="agree" class="form-check-label">
                I agree that if anything happens to the borrowed items, it is my responsibility.
            </label>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-danger">Clear</button>

        </form>

    </body>

</html>
