<!DOCTYPE html>
<html>

<head>
    <title>Barangay Borrower Slip</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table width="100%">
        <tr>
            <td class="logo-left">
                <img src="assets/images/Barangay_Logo.jfif" alt="Barangay Logo" width="200" height="200">
            </td>

            <td class="header">
                <h1>Barangay Pasong Camachile II</h1>
                <h3>General Trias, Cavite 4107, Philippines</h3>
                <h2>BORROWER SLIP</h2>
            </td>

            <td class="logo-right">
                <img src="assets/images/Barangay Pasong Camachile.jfif" alt="Barangay SK Logo" width="200" height="200">
            </td>
        </tr>
    </table>

    <hr>

    <form method="POST" action="home.html">

        <div>
            <label for="f-name">Name:</label>
            <input type="text" id="f-name" name="name" required>
        </div>

        <div>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
        </div>

        <div>
            <label for="chairs">No. of Chairs:</label>
            <input type="number" id="chairs" name="chairs" min="0" required>
        </div>

        <div>
            <label for="tables">No. of Tables:</label>
            <input type="number" id="tables" name="tables" min="0">
        </div>

        <div>
            <label for="tents">No. of Tents:</label>
            <input type="number" id="tents" name="tents" min="0">
        </div>

        <div>
            <label for="dateBorrowed">Date Borrowed:</label>
            <input type="datetime-local" id="dateBorrowed" name="dateBorrowed" required>
        </div>

        <div>
            <label for="dateReturned">Date Returned:</label>
            <input type="datetime-local" id="dateReturned" name="dateReturned" required>
        </div>

        <div>
            <label for="file">Valid ID:</label>
            <input type="file" id="file" name="file">
        </div>

        <div class="checkbox">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">
                I agree that if anything happens to the borrowed items, it is my responsibility.
            </label>
        </div>

        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </div>

    </form>

</body>

</html>
