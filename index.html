    <body>

        <div class="page-header">
            <div class="header-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuZgnKmlSs16898Vpj4i2hPZrWVWR6HTFqj0si5EmTug&s=10" alt="City Logo">

            <div class="header-text">
                <h1>Barangay Pasong Camachile II</h1>
                <p>General Trias, Cavite 4107, Philippines</p>
                <h2>BORROWER SLIP</h2>

            <div class="header-logo">

        <hr>
        <form method="POST" action="home.html">

            <fieldset>
                <legend>Borrower information</legend>
                    <div class="form-grid">
                    <label for="f-name">Name: <span aria-hidden="true">*</span></label>
                    <input type="text" id="f-name" name="name" required>

                    <label for="address">Address: <span aria-hidden="true">*</span></label>
                    <input type="text" id="address" name="address" required>
                    </div>
            </fieldset>

            <fieldset>
            <legend>Items to borrow</legend>

                <div class="items-grid">
                    <label for="chairs">No. of Chairs:</label>
                    <input type="number" id="chairs" name="chairs" min="0" required aria-required="true">

                    <label for="tables">No. of Tables:</label>
                    <input type="number" id="tables" name="tables" min="0">

                    <label for="tents">No. of Tents:</label>
                    <input type="number" id="tents" name="tents" min="0">
                </div>
            </fieldset>

            <fieldset>
            <legend>Borrowing period</legend>

                <div class="date-grid">
                    <label for="dateBorrowed">Date Borrowed: <span aria-hidden="true">*</span></label>
                    <input type="datetime-local" id="dateBorrowed" name="dateBorrowed" required>

                    <label for="dateReturned">Date Returned: <span aria-hidden="true">*</span></label>
                    <input type="datetime-local" id="dateReturned" name="dateReturned" required>
                </div>
            </fieldset>
