<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Barangay Borrower Slip</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body class ="home-body">

        <div class="page-header">

            <div class="header-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuZgnKmlSs16898Vpj4i2hPZrWVWR6HTFqj0si5EmTug&s=10"
                    alt="City Logo">
            </div>

            <div class="header-text">
                <h1>Barangay Pasong Camachile II</h1>
                <p>General Trias, Cavite 4107, Philippines</p>
                <h2>BORROWER SLIP</h2>
            </div>

            <div class="header-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZuU4BRcMTH_HZ2bykXINJzdM9kAINczMgkMHQpXkjkw&s=10"
                    alt="Barangay SK Logo">
            </div>

        </div>

        <hr>

        <form class="form-index" method="POST" action="home.html">

            <div class="form-section">

                <h3>Borrower Information</h3>

                <div class="form-grid">

                    <label for="f-name">Name: <span>*</span></label>
                    <input type="text" id="f-name" name="name" required>

                    <label for="address">Address: <span>*</span></label>
                    <input type="text" id="address" name="address" required>

                </div>

            </div>

            <div class="form-section">

                <h3>Items to Borrow</h3>

                <div class="items-grid">
                    <div class="item-field">
                        <label for="chairs"> No. of Chairs:</label>
                        <input type="number" id="chairs" name="chairs" min="0" required>

                    </div>
                    <div class="item-field">
                        <label for="tables"> No. of Tables:</label>
                        <input type="number" id="tables" name="tables" min="0">

                    </div>
                    <div class="item-field">
                        <label for="tents"> No. of Tents:</label>
                        <input type="number" id="tents" name="tents" min="0">

                    </div>
                </div>
            </div>

            <div class="form-section">

                <h3>Borrowing Period</h3>

                <div class="date-grid">
                    <div>
                        <label for="dateBorrowed"> Date Borrowed: <span>*</span></label>
                        <input type="datetime-local" id="dateBorrowed" name="dateBorrowed" required>

                    </div>
                    <div>
                        <label for="dateReturned"> Date Returned: <span>*</span></label>
                        <input type="datetime-local" id="dateReturned" name="dateReturned" required>

                    </div>
                </div>
            </div>

            <div class="form-section">

                <h3>Verification</h3>

                <div class="verification">
                    <label for="validID"> Valid ID Upload With Signature:<span>*</span></label>
                    <input type="file" id="validID" name="file" accept="image/*,.pdf" required>

                </div>

                <div class="agreement">
                    <input type="checkbox" id="agree" name="agree" checked>
                    <label for="agree" > I agree that if anything happens to the borrowed items, it is my responsibility.</label>

                </div>
            </div>

            <p class="required-text">Fields marked with * are required.</p>

            <div class="buttons">
                <button type="submit" class="submit-btn"> Submit </button>
                <button type="reset" class="clear-btn">Clear</button>

            </div>

        </form>

    </body>

</html>
